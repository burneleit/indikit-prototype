*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:Ubuntu,system-ui,sans-serif;color:#1A1A1A}

.ik{width:1280px;background:#F1F1F1;font-family:Ubuntu,system-ui,sans-serif}
.ik-in{width:1100px;margin:0 auto;background:#fff}
.ik-nav>a,.ik-nav>div>a{color:#fff;text-decoration:none;font-weight:500;font-size:17px;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:6px;height:76px;cursor:pointer}

.ik-tile{display:flex;align-items:center;gap:20px;padding:0 22px;height:80px;background:#fff;border:1px solid #E3E1DD;color:#1A1A1A;text-decoration:none;font-size:18px;font-weight:500;line-height:1.2;transition:border-color .15s}

.ik-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 26px;background:#C24E00;color:#fff;font-weight:700;font-size:16px;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
.ik-btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 24px;background:transparent;color:#C24E00;font-weight:700;font-size:16px;text-transform:uppercase;text-decoration:none;border:2px solid #C24E00;cursor:pointer;white-space:nowrap}.ik-btn2:hover{background:#FFF4EC;color:#A84300}.ik-btn2.inv{color:#fff;border-color:#fff}.ik-btn2.inv:hover{background:rgba(255,255,255,.1);color:#fff}

.ik-p{font-size:17px;line-height:1.5;color:#1A1A1A;margin:0}

.ik{width:100%;min-width:1180px}
.ik-in{width:1100px}
.ik-nav>div>a{cursor:pointer}
.ab-pl:hover{border-color:#C24E00 !important;color:#C24E00 !important}
.ik-dd:hover{color:#C24E00 !important;background:#FFF4EC}
.ik-stile{height:auto;min-height:56px;padding:10px 14px;gap:14px;font-size:15px}.ik-stile img{width:30px;height:30px}
@keyframes tIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.ik-stile.on{border-color:#C24E00;background:#FFF4EC}
.ik-crumb{color:#1A1A1A;text-decoration:underline;text-decoration-color:#C9C6C0;text-underline-offset:3px}.ik-crumb:hover{color:#C24E00;text-decoration-color:#C24E00}
.rs-li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:16px 0;border-bottom:1px solid #E3E1DD}
.rs-t{font-size:18px;font-weight:500;line-height:1.35}
.rs-dl{display:flex;align-items:center;gap:6px}
.rs-l{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid #E3E1DD;background:#fff;color:#1A1A1A;font:500 14px Ubuntu,sans-serif;cursor:pointer;transition:border-color .15s,color .15s}
.rs-l:hover{border-color:#C24E00;color:#C24E00}
.rs-l.done{border-color:#2E7D4F;color:#1F6B3F;background:#EEF7F1}
.rs-jump a{color:#1A1A1A;text-decoration:none;font-weight:500;font-size:16px;padding:10px 16px;border:1px solid #E3E1DD;background:#fff}
.rs-jump a:hover{border-color:#C24E00;color:#C24E00}
:focus-visible{outline:3px solid #16253F;outline-offset:2px}header :focus-visible,.ik-dark :focus-visible{outline-color:#fff}
.ik-dark .ik-eye{color:#FF8A33}.ik-dark a:not(.ik-btn):not(.ik-btn2){color:#fff}
.ik-in{width:100%!important;max-width:none}
.ik{--pad:max(30px,calc((100vw - 1280px) / 2 + 30px))}
.ik-in>section,.ik-in>div:not(.ik-grid)>section,.ik-in>footer>div,.ik-in>nav{padding-left:var(--pad)!important;padding-right:var(--pad)!important}
.ik>header{padding-left:var(--pad)!important;padding-right:var(--pad)!important}
.ik-grid{max-width:1280px;width:100%;margin:0 auto}
.ik-skip{position:absolute;left:16px;top:-60px;z-index:2000;background:#fff;color:#1A1A1A;padding:12px 18px;font-weight:700;text-decoration:underline}.ik-skip:focus{top:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

  return <div style={{position:"absolute",top:"100%",left:-20,width:260,background:"#fff",borderTop:`3px solid ${O}`,boxShadow:"0 0 0 1px "+RULE+", 0 10px 28px rgba(22,37,63,.18)",zIndex:20}}><a href="IndiKit About prototype.html" className="ik-dd" style={{...it,borderTop:0}}>About IndiKit</a><a href="IndiKit Updates prototype.html" className="ik-dd" style={it}>What's new</a><a href="IndiKit Sources prototype.html" className="ik-dd" style={it}>Sources &amp; standards</a><a href="IndiKit Own prototype.html" className="ik-dd" style={it}>Your own IndiKit</a></div>;

function Header({open=false,about=false,active}){

                <div style={{position:"relative"}} onMouseEnter={()=>setAb(true)} onMouseLeave={()=>setAb(false)} onFocus={()=>setAb(true)} onBlur={e=>{if(!e.currentTarget.contains(e.relatedTarget))setAb(false)}} onKeyDown={e=>{if(e.key==="Escape")setAb(false)}}><a href="IndiKit About prototype.html" style={["about","updates","sources"].includes(active)?{boxShadow:"inset 0 -3px 0 #FF6F00"}:undefined}>About <Chev/></a>{(about||ab)&&<AboutMenu/>}</div><div style={{position:"relative"}} onMouseEnter={()=>setRs(true)} onMouseLeave={()=>setRs(false)} onFocus={()=>setRs(true)} onBlur={e=>{if(!e.currentTarget.contains(e.relatedTarget))setRs(false)}} onKeyDown={e=>{if(e.key==="Escape")setRs(false)}}><a href="IndiKit Resources hub prototype.html" style={active==="res"?{boxShadow:"inset 0 -3px 0 #FF6F00"}:undefined}>Tools &amp; Guides <Chev/></a>{rs&&<ResMenu/>}</div>

 ["Humanitarian standards",[["Sphere Handbook","https://spherestandards.org/handbook/","Minimum standards for WASH, food security, nutrition, shelter and health response."],["Core Humanitarian Standard (CHS)","https://www.corehumanitarianstandard.org/","Accountability and quality commitments, used for cross-cutting indicators."],["Global Cluster guidance","https://www.humanitarianresponse.info/","Indicator registries of the Nutrition, WASH, Food Security, Health and Protection clusters."]]],

 ["Practitioner networks",[["CaLP","https://www.calpnetwork.org/","Cash and voucher assistance monitoring."],["Food Security & Nutrition Network","https://www.fsnnetwork.org/","Tools and guidance from food security practitioners."]]]

      <main id="main" tabIndex={-1} className="ik-in" style={{outline:"none"}}><div className="ik-grid" style={{display:"grid",gridTemplateColumns:"280px minmax(0,1fr)"}}><Sidebar/><div style={{minWidth:0}}>

function Toast(){
  const [m,setM]=React.useState(null);
  React.useEffect(()=>{
    const f=e=>{const a=e.target.closest("a,[data-na]");if(!a)return;const u=a.getAttribute("href");
      if(u&&u.includes("#indicators")&&document.getElementById("indicators")){e.preventDefault();window.scrollTo({top:document.getElementById("indicators").getBoundingClientRect().top+window.scrollY-20,behavior:"smooth"});return;}
      if(a.hasAttribute("data-na")||!u||u==="#"){e.preventDefault();setM(a.getAttribute("aria-label")||a.textContent.trim()||"This link");clearTimeout(window.__t);window.__t=setTimeout(()=>setM(null),4000);}};
    document.addEventListener("click",f,true);return()=>document.removeEventListener("click",f,true);
  },[]);
  if(!m)return null;
  return (
    <div role="alert" style={{position:"fixed",left:"50%",top:96,transform:"translateX(-50%)",zIndex:1000,background:"#fff",borderTop:"4px solid "+O,boxShadow:"0 0 0 1px "+RULE+", 0 16px 40px rgba(22,37,63,.28)",padding:"18px 20px 18px 22px",display:"flex",alignItems:"flex-start",gap:14,width:460,maxWidth:"calc(100vw - 32px)",animation:"tIn .2s ease-out"}}>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke={O} strokeWidth="2" strokeLinecap="round" style={{flex:"none",marginTop:1}}><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.01"/></svg>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:17,fontWeight:700,color:"#1A1A1A",marginBottom:4}}>Not part of this test</div>
        <div style={{fontSize:15,lineHeight:1.45,color:"#1A1A1A"}}>“{m.length>60?m.slice(0,60)+"…":m}” isn’t included in the prototype. Please continue with another part of the page.</div>
      </div>
      <button onClick={()=>setM(null)} aria-label="Close" style={{flex:"none",background:"none",border:0,cursor:"pointer",padding:4,color:"#1A1A1A",fontSize:22,lineHeight:1}}>×</button>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("app")).render(<><About/><Toast/></>);
